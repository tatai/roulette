    <header class="app__header">
      <h1 class="app__title">Roulette Picker</h1>
      <p class="app__subtitle">Pick one person at a time, without repeats.</p>
    </header>

    <main class="app">
      <section class="roster roster--available">
        <h2 class="roster__title">
          Available <span id="availableCount" class="roster__count">0</span>
        </h2>
        <ul id="availableList" class="roster__list"></ul>
        <p id="availableEmpty" class="roster__empty">No people available.</p>
      </section>

      <section id="stage" class="stage" data-mode="focus">
        <ul id="stageBoard" class="board"></ul>
        <div id="stageWheel" class="wheel">
          <div class="wheel__pointer"></div>
          <canvas id="wheelCanvas" class="wheel__canvas" width="520" height="520"></canvas>
        </div>
        <div id="stageName" class="stage__name"></div>
        <p id="stageMessage" class="stage__message">Press Next to start.</p>
        <button id="spinButton" type="button" class="button button--primary">
          Next
        </button>
        <div class="modes" role="radiogroup" aria-label="Selection mode">
          <button type="button" class="modes__option" role="radio" data-mode="classic">Classic</button>
          <button type="button" class="modes__option" role="radio" data-mode="focus">Focus</button>
          <button type="button" class="modes__option" role="radio" data-mode="wheel">Wheel</button>
        </div>
      </section>

      <section class="roster roster--selected">
        <h2 class="roster__title">
          Selected <span id="selectedCount" class="roster__count">0</span>
        </h2>
        <ul id="selectedList" class="roster__list"></ul>
        <p id="selectedEmpty" class="roster__empty">Nobody selected yet.</p>
      </section>
    </main>

    <footer class="composer">
      <label class="composer__label" for="nameInput">Add a person</label>
      <div class="composer__row">
        <input
          id="nameInput"
          class="composer__input"
          type="text"
          placeholder="Type a name"
          autocomplete="off"
        />
        <button id="addButton" type="button" class="button">Add</button>
      </div>
    </footer>
  </body>
</html>
